# A Job that resolves one mapped variable through OpenBao with the pod's SPIFFE identity and
# prints only "resolved <VAR> from openbao (N bytes)". The image comes from a private registry:
# set GRAUWOLF_IMAGE (env.sh) and create the pull secret `registry-agentswork` in the namespace:
#   kubectl -n agents create secret docker-registry registry-agentswork \
#     --docker-server=<registry> --docker-username=<user> --docker-password=<token>
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${SERVICE_ACCOUNT}
  namespace: ${NAMESPACE}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grauwolf-credentials
  namespace: ${NAMESPACE}
data:
  grauwolf.toml: |
    [credentials.openbao]
    address = "${BAO_ADDR}"
    auth = { spiffe = { audience = "${AUDIENCE}", role = "${ROLE}", mount = "${JWT_MOUNT}" } }
    refresh = "5m"

    [credentials.variables]
    ATLASSIAN_API_TOKEN = "openbao:${KV_MOUNT}/${SECRET_PATH}#${SECRET_FIELD}"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: grauwolf-credentials-check
  namespace: ${NAMESPACE}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grauwolf
    spec:
      restartPolicy: Never
      serviceAccountName: ${SERVICE_ACCOUNT}
      # Fits the "restricted" Pod Security Standard (a namespace for agents should enforce it).
      # The user is numeric: the image's user `nonroot` is a name, which runAsNonRoot cannot check.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets:
        - name: registry-agentswork
      containers:
        - name: grauwolf
          image: ${GRAUWOLF_IMAGE}
          command: ["grauwolf", "credentials", "check", "ATLASSIAN_API_TOKEN", "--config", "/etc/grauwolf/grauwolf.toml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          env:
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///spiffe-workload-api/agent.sock
          volumeMounts:
            - { name: config, mountPath: /etc/grauwolf, readOnly: true }
            - { name: spiffe-workload-api, mountPath: /spiffe-workload-api, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: grauwolf-credentials
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true

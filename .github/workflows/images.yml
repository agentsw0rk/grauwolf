# Container images (ADR-0096): build and smoke-test on every push to main and every pull request
# (amd64; arm64 too on tags and manual runs).
# On tags `v*` the CLI image, the grauwolf-tools image and the builder image are built for amd64 on
# `ubuntu-24.04` and for arm64 on the native `ubuntu-24.04-arm` runner (no QEMU), pushed per
# architecture by digest and merged into one multi-arch tag on ghcr.io (private packages; the
# owner sets the tag himself, see the release procedure in the developer guide).
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The version of the workspace; on a tag it must be the tag's version, because the builder image
  # (`GRAUWOLF_VERSION`) and the generated Dockerfiles are checked against it.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version of the workspace
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version" >&2
            exit 1
          fi

  # Smoke tests of the CLI image, the tools image and an agent image (amd64).
  images:
    needs: version
    runs-on: ubuntu-24.04
    env:
      LABELS: |
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.version=${{ needs.version.outputs.version }}
        org.opencontainers.image.revision=${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the CLI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/cli.Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          tags: grauwolf:ci
          labels: ${{ env.LABELS }}
          cache-from: type=gha,scope=cli-amd64
          cache-to: type=gha,scope=cli-amd64,mode=max

      - name: Run the CLI image
        run: |
          docker run --rm grauwolf:ci --version
          docker run --rm grauwolf:ci version --json

      # The lean tool program (ADR-0118): the image must build, report its version and validate a
      # package folder without compiling anything.
      - name: Build the grauwolf-tools image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tools.Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          tags: grauwolf-tools:ci
          labels: ${{ env.LABELS }}
          cache-from: type=gha,scope=tools-amd64
          cache-to: type=gha,scope=tools-amd64,mode=max

      - name: Run the grauwolf-tools image
        run: |
          docker run --rm grauwolf-tools:ci --version
          docker run --rm -v "$PWD:/work" -w /work grauwolf-tools:ci validate docs/user-guide/examples/03-package

      - name: Build the agent image (echo spec, distroless)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agent.Dockerfile
          build-args: SPEC=examples/specs/echo.json
          target: runtime
          platforms: linux/amd64
          load: true
          tags: grauwolf-agent:ci
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max

      # The model is not needed for /health; `GRAUWOLF_ALLOW_ANONYMOUS` lets the service start
      # without a token (it binds 0.0.0.0). `--retry-all-errors`: Docker's port proxy accepts the
      # connection before the service listens and then resets it (curl error 56), which
      # `--retry-connrefused` does not retry.
      - name: Start the agent and check /health
        run: |
          docker run -d --name agent -p 8080:8080 -e GRAUWOLF_ALLOW_ANONYMOUS=true grauwolf-agent:ci
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors \
            http://localhost:8080/health
          echo
          curl --fail --silent --show-error http://localhost:8080/.well-known/agent-card.json
          echo
          docker stop agent

      - name: Show logs on failure
        if: failure()
        run: |
          docker ps -a --filter name=agent --format '{{.Names}}: {{.Status}}' || true
          docker logs agent || true

  # The builder image holds the vendored and pre-compiled dependencies. An agent generated by it
  # builds without any network access, which this job proves, once per architecture, each on a
  # native runner. The image tested is the image pushed: the plain `docker build` (no buildx
  # container) leaves it in the local image store, where the next `docker build` finds it.
  builder:
    needs: version
    strategy:
      fail-fast: false
      # arm64 only on tags and manual runs: native arm64 runners for private repositories may need a
      # matching GitHub plan; without one the job would wait for a runner on every push.
      matrix:
        include: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]' || '[{"arch":"amd64","runner":"ubuntu-24.04"}]') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      BUILDER_IMAGE: ghcr.io/agentsw0rk/grauwolf-builder
    steps:
      - uses: actions/checkout@v4

      # The image is several GiB and the build needs about as much again.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /

      - name: Build the builder image
        run: |
          start=$(date +%s)
          docker build -f docker/builder.Dockerfile \
            --build-arg GRAUWOLF_VERSION=${{ needs.version.outputs.version }} \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t grauwolf-builder:ci .
          echo "builder image built in $(( $(date +%s) - start )) s"
          docker images grauwolf-builder:ci

      - name: The CLI in the builder image reports the version and the builder image
        run: |
          docker run --rm grauwolf-builder:ci grauwolf version --json

      # What AgentWeaver does: generate in the builder image, then build the directory. The
      # generated Dockerfile checks the builder's version in its first build step (the positive
      # case); the image is a local one, so the name is overridden and the version still matches.
      - name: Generate the agent crate with its Dockerfile
        run: |
          docker run --rm -v "$PWD:/work" -w /work grauwolf-builder:ci \
            grauwolf spec generate examples/specs/echo.json --dockerfile --out agent \
            --builder-image grauwolf-builder:ci
          cat agent/Dockerfile

      - name: Build the agent offline
        run: |
          start=$(date +%s)
          docker build --network none -t grauwolf-agent-offline:ci agent
          echo "offline agent build took $(( $(date +%s) - start )) s"

      - name: Start the agent and check /health
        run: |
          docker run -d --name agent -p 8080:8080 -e GRAUWOLF_ALLOW_ANONYMOUS=true grauwolf-agent-offline:ci
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors \
            http://localhost:8080/health
          echo
          docker stop agent

      # Tool sources (ADR-0095): generated without compiling anything, the tools are built by
      # `grauwolf tools build` inside the offline image build.
      - name: Generate an agent with tools as sources
        run: |
          docker run --rm -v "$PWD:/work" -w /work grauwolf-builder:ci \
            grauwolf spec generate examples/specs/calculator.json --tool-sources --dockerfile \
            --out agent-tools --builder-image grauwolf-builder:ci
          test ! -e agent-tools/tools/add.wasm
          cat agent-tools/Dockerfile

      - name: Build the agent with tool sources offline
        run: |
          start=$(date +%s)
          docker build --network none -t grauwolf-agent-tools:ci agent-tools
          echo "offline agent build with tool sources took $(( $(date +%s) - start )) s"

      - name: Start the agent with tool sources and check /health
        run: |
          docker run -d --name agent-tools -p 8081:8080 -e GRAUWOLF_ALLOW_ANONYMOUS=true grauwolf-agent-tools:ci
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors \
            http://localhost:8081/health
          echo
          docker stop agent-tools

      - name: Show logs on failure
        if: failure()
        run: |
          docker ps -a --filter name=agent --format '{{.Names}}: {{.Status}}' || true
          docker logs agent || true
          docker logs agent-tools || true

      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The classic image store cannot push an image without a name, so the tested image goes up
      # under a per-architecture tag, and the job records its digest; the merge job refers to the
      # digests only. The per-architecture tags are not used by anyone.
      - name: Push the builder image of this architecture
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          image=${{ env.BUILDER_IMAGE }}:${{ needs.version.outputs.version }}-${{ matrix.arch }}
          docker tag grauwolf-builder:ci "$image"
          docker push "$image"
          digest=$(docker image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep "^${{ env.BUILDER_IMAGE }}@sha256:" | head -n 1)
          test -n "$digest"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest##*@sha256:}"

      - name: Keep the digest for the merge job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: digests-builder-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The CLI image and the tools image per architecture, each on a native runner; pushed by digest
  # only (no tag), the merge job gives the tags. Only after the smoke tests of `images`.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, images]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cli, image: ghcr.io/agentsw0rk/grauwolf, file: docker/cli.Dockerfile, arch: amd64, runner: ubuntu-24.04 }
          - { name: cli, image: ghcr.io/agentsw0rk/grauwolf, file: docker/cli.Dockerfile, arch: arm64, runner: ubuntu-24.04-arm }
          - { name: tools, image: ghcr.io/agentsw0rk/grauwolf-tools, file: docker/tools.Dockerfile, arch: amd64, runner: ubuntu-24.04 }
          - { name: tools, image: ghcr.io/agentsw0rk/grauwolf-tools, file: docker/tools.Dockerfile, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: runtime
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }},mode=max

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One multi-arch tag per image from the two digests: `<version>`, and `latest` for the CLI and
  # tools images (not for the builder: it must match the CLI that generates, see the version guard).
  merge:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, builder, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cli, image: ghcr.io/agentsw0rk/grauwolf, latest: "true" }
          - { name: tools, image: ghcr.io/agentsw0rk/grauwolf-tools, latest: "true" }
          - { name: builder, image: ghcr.io/agentsw0rk/grauwolf-builder, latest: "false" }
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch tag
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.version }}
          LATEST: ${{ matrix.latest }}
        run: |
          test "$(ls | wc -l)" = 2
          tags=(-t "$IMAGE:$VERSION")
          if [ "$LATEST" = "true" ]; then tags+=(-t "$IMAGE:latest"); fi
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

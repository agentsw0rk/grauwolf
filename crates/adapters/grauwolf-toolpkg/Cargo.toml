[package]
name = "grauwolf-toolpkg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# In-memory registry (distribution API v2 subset) for tests of this and other crates.
test-registry = ["grauwolf-oci/test-registry"]

[dependencies]
grauwolf-config.workspace = true
grauwolf-git.workspace = true
grauwolf-oci.workspace = true
grauwolf-spec.workspace = true
grauwolf-toolbuild.workspace = true
grauwolf-tools.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
grauwolf-test.workspace = true
grauwolf-git = { workspace = true, features = ["test-git-server"] }
grauwolf-toolpkg = { path = ".", features = ["test-registry"] }
tokio = { workspace = true, features = ["net"] }

[[example]]
name = "serve_test_package"
required-features = ["test-registry"]

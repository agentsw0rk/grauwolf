// The part of the SPIFFE Workload API (github.com/spiffe/go-spiffe, `proto/spiffe/workload/
// workload.proto`) that grauwolf uses. `src/proto.rs` holds the matching messages by hand; field
// numbers and names must stay as here. 
syntax = "proto3";

service SpiffeWorkloadAPI {
  rpc FetchJWTSVID(JWTSVIDRequest) returns (JWTSVIDResponse);
  rpc ValidateJWTSVID(ValidateJWTSVIDRequest) returns (ValidateJWTSVIDResponse);
  rpc FetchX509SVID(X509SVIDRequest) returns (stream X509SVIDResponse);
  rpc FetchX509Bundles(X509BundlesRequest) returns (stream X509BundlesResponse);
}

message ValidateJWTSVIDRequest {
  string audience = 1;
  string svid = 2;
}
// The real response also carries `claims` (google.protobuf.Struct, field 2); grauwolf ignores it.
message ValidateJWTSVIDResponse {
  string spiffe_id = 1;
}

message X509SVIDRequest {}
message X509SVIDResponse {
  repeated X509SVID svids = 1;
  repeated bytes crl = 2;
  map<string, bytes> federated_bundles = 3;
}
message X509SVID {
  string spiffe_id = 1;
  bytes x509_svid = 2;      // concatenated DER, leaf first
  bytes x509_svid_key = 3;  // PKCS#8 DER
  bytes bundle = 4;         // concatenated DER of the own trust domain
  string hint = 5;
}
message X509BundlesRequest {}
message X509BundlesResponse {
  repeated bytes crl = 1;
  map<string, bytes> bundles = 2;  // key spiffe://<domain>, concatenated DER
}

message JWTSVIDRequest {
  repeated string audience = 1;
  // Optional: the SPIFFE ID of the SVID; empty selects every identity of the workload.
  string spiffe_id = 2;
}

message JWTSVIDResponse {
  repeated JWTSVID svids = 1;
}

message JWTSVID {
  string spiffe_id = 1;
  string svid = 2;
  string hint = 3;
}

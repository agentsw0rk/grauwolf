[package]
name = "grauwolf-spiffe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Test identities and a fake Workload API server on a Unix socket, for the tests of this and of
# other crates.
testing = ["dep:base64", "dep:serde_json", "dep:aws-lc-rs"]

[dependencies]
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"], optional = true }
base64 = { workspace = true, optional = true }
bytes = "1"
futures-util.workspace = true
grauwolf-config.workspace = true
h2 = "0.4"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "aws-lc-rs"] }
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "time", "sync"] }

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
grauwolf-spiffe = { path = ".", features = ["testing"] }
grauwolf-test.workspace = true
tokio = { workspace = true, features = ["net", "rt", "macros"] }

[package]
name = "grauwolf-k8s"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# `FakeCluster`: an in-memory Kubernetes API server (a tower service) for the tests of this and
# other crates.
testing = ["dep:tower"]

[dependencies]
base64.workspace = true
bytes = "1"
http = "1"
http-body-util = "0.1"
# The client; rustls only, no OpenSSL. `ws` (exec, attach) is not needed.
kube = { version = "5.1", default-features = false, features = ["client", "rustls-tls", "ring"] }
# kube needs one Kubernetes version feature: the newest one up to the cluster's 1.34 (ADR-0120).
k8s-openapi = { version = "0.29", default-features = false, features = ["v1_34"] }
# The crypto provider `connect` installs: the one kube uses here (feature `ring` above).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["time"] }
tower = { version = "0.5", default-features = false, optional = true }

[dev-dependencies]
grauwolf-test.workspace = true
grauwolf-k8s = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt"] }

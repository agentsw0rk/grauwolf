[package]
name = "grauwolf-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# In-memory server for the HTTP+SSE transport (protocol 2024-11-05) for tests of this and
# other crates, and for the example `serve_sse_mcp` (ADR-0112).
test-sse-server = ["dep:axum", "tokio/net"]

[dependencies]
axum = { workspace = true, optional = true }
reqwest = { workspace = true }
futures-util.workspace = true
grauwolf-prompt.workspace = true
grauwolf-spiffe.workspace = true
grauwolf-tools.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "sync"] }

[dev-dependencies]
grauwolf-mcp = { path = ".", features = ["test-sse-server"] }
grauwolf-spiffe = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
wiremock.workspace = true

[[example]]
name = "serve_sse_mcp"
required-features = ["test-sse-server"]

[[test]]
name = "sse"
required-features = ["test-sse-server"]

[[test]]
name = "delegation"
required-features = ["test-sse-server"]

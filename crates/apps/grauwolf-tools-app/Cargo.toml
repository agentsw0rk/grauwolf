[package]
name = "grauwolf-tools-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "grauwolf_tools_app"
path = "src/lib.rs"

# The program is called `grauwolf-tools` (ADR-0118); the package has another name because the
# domain crate `grauwolf-tools` (tool contract) holds that one.
[[bin]]
name = "grauwolf-tools"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
grauwolf-agent-tree = { workspace = true, features = ["packages"] }
grauwolf-config.workspace = true
grauwolf-spec.workspace = true
grauwolf-toolbuild.workspace = true
grauwolf-toolpkg.workspace = true
grauwolf-tools.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
grauwolf-git = { workspace = true, features = ["test-git-server"] }
grauwolf-toolpkg = { workspace = true, features = ["test-registry"] }
tokio.workspace = true

# Builds, checks and publishes the tool package {{name}} (scaffolded by `grauwolf-tools new`).
# Runs in the grauwolf-tools image, which has the Rust toolchain with the WASM target.
name: grauwolf-tools

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    container: ghcr.io/agentsw0rk/grauwolf-tools:latest
    env:
      TOOLS_REGISTRY: ${{ vars.TOOLS_REGISTRY }}
      TOOLS_REPOSITORY: ${{ vars.TOOLS_REPOSITORY || format('{0}/{{name}}', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: grauwolf-tools validate .
      - name: Test
        run: cargo test
      - name: Pack
        run: |
          # The commit time as the build date makes the package reproducible.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" grauwolf-tools pack .
      - name: Sign, push and add to the catalog
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GRAUWOLF_REGISTRY_AUTH: ${{ secrets.GRAUWOLF_REGISTRY_AUTH }}
          SIGNING_KEY: ${{ secrets.GRAUWOLF_TOOLS_SIGNING_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"$version\"" grauwolf-tools.json \
            || { echo "the tag $GITHUB_REF_NAME does not match the version in grauwolf-tools.json"; exit 1; }
          umask 077
          key="$RUNNER_TEMP/signing.key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          grauwolf-tools push dist "$TOOLS_REGISTRY/$TOOLS_REPOSITORY:$version" --sign-key "$key"
